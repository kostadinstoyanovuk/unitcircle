name: package smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-09-24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified 2026-09-24
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation .
      - run: python -m unittest discover -s tests -v
